[project]
name = "billing-copilot"
version = "3.0.0"
description = "Policy-grounded billing support drafts with an offline client demo."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn==0.53.0",
    "pydantic==2.13.5",
    "python-dotenv==1.1.0",
    "python-multipart==0.0.32",
    "pypdf==6.19.0",
]

[project.optional-dependencies]
live = [
    "asyncpg==0.31.0",
    "pydantic-ai-slim[openai]==2.46.0",
    "openai==3.16.2",
    "numpy==2.5.3",
    "httpx==0.28.1",
]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "ruff==0.16.8"]
local = ["sentence-transformers>=3.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# The web application is run from the checkout, which also supplies frontend,
# SQL, and sample policies. A wheel alone is not a standalone web deployment.
